<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TVTOTO GENERATOR SHIO</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;

-webkit-user-select:none;
-moz-user-select:none;
-ms-user-select:none;
user-select:none;

-webkit-touch-callout:none;
}

body{

background-image:url('https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/tvtoto_backgroundweb.png');
background-size:cover;
background-position:center;
background-attachment:fixed;
background-repeat:no-repeat;

font-family:'Poppins',sans-serif;
padding:20px;
color:white;
overflow-x:auto;
}



/* ================= CONTAINER ================= */

.container{
max-width:1700px;
margin:auto;

display:flex;
flex-direction:row;

align-items:flex-start;
justify-content:center;

gap:25px;
}

/* ================= PREVIEW ================= */

.preview-wrap{
width:100%;
overflow:auto;
display:flex;
justify-content:center;
padding-bottom:10px;
}

.preview{

width:1254px;
height:1254px;

min-width:1254px;
min-height:1254px;

position:relative;
overflow:hidden;
flex-shrink:0;

/* DEFAULT TEMPLATE */
background-image:url('https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/tvtotolayout.png');

background-size:cover;
background-position:center;
background-repeat:no-repeat;

}

/* ================= LAYER ================= */

.market,
.shio-circle{
z-index:10;
}

.date-box,
.shio-name,
.colok,
.bbfs,
.angka,
.syair{
z-index:20;
}

/* ================= DATE ================= */

.date-box{
position:absolute;
top:185px;
left:50%;
transform:translateX(-50%);

width:310px;
height:70px;

display:flex;
align-items:center;
justify-content:center;

font-size:38px;
font-family:'Cinzel',serif;
font-weight:700;

color:#ffd86b;

letter-spacing:1px;

text-shadow:0 2px 5px rgba(0,0,0,.7);
}

/* ================= MARKET ================= */

.market{
position:absolute;
top:275px;
left:50%;
transform:translateX(-50%);

width:100%;

display:flex;
justify-content:center;
align-items:center;
}

.market img{
max-width:420px;
max-height:90px;
object-fit:contain;
filter:drop-shadow(0 4px 5px rgba(0,0,0,.6));
}

/* KHUSUS HONGKONG LOTTO */

.market-hk{
padding:10px;
max-width:460px !important;
max-height:100px !important;

transform:translateY(-8px);
}

/* KHUSUS SYDNEY LOTTO */

.market-sydney{
padding:10px;
max-width:380px !important;
max-height:170px !important;

transform:translateY(6px);
}

/* ================= SHIO ================= */

.shio-circle{
position:absolute;
top:433px;
left:450px;

width:345px;
height:345px;

border-radius:50%;
overflow:hidden;
}

.shio-circle img{
width:100%;
height:100%;
object-fit:cover;
}

.shio-name{
position:absolute;
top:825px;
left:50%;
transform:translateX(-50%);

width:420px;
height:80px;

display:flex;
align-items:center;
justify-content:center;

font-size:40px;
font-family:'Cinzel',serif;
font-weight:900;

color:#ffd86b;

letter-spacing:2px;

text-shadow:0 3px 5px rgba(0,0,0,.7);
}

/* ================= COLOK ================= */

.colok{
position:absolute;
top:558px;
left:68px;

width:280px;
height:260px;
}

.colok-content{
display:grid;
grid-template-columns:1fr 1fr;

row-gap:40px;

font-size:84px;
font-weight:900;

text-align:center;
color:white;

line-height:1;

text-shadow:0 4px 5px rgba(0,0,0,.7);
}

/* ================= BBFS ================= */

.bbfs{
position:absolute;
top:566px;
right:63px;

width:290px;
height:170px;
}

.box-content{
font-size:65px;
font-weight:900;

text-align:center;

color:white;

letter-spacing:1px;

text-shadow:0 4px 5px rgba(0,0,0,.7);
}

/* ================= ANGKA MAIN ================= */

.angka{
position:absolute;
top:830px;
right:59px;

width:300px;
height:120px;
}

.angka-content{
font-size:34px;
font-weight:700;

text-align:center;

color:white;

text-shadow:0 3px 5px rgba(0,0,0,.7);
}

/* ================= SYAIR ================= */

.syair{
position:absolute;
bottom:85px;
left:50%;
transform:translateX(-50%);

width:600px;
height:210px;

padding:20px;
}

.syair-text{
font-size:25px;
font-weight:700;
line-height:1.45;

text-align:center;
color:white;

text-shadow:0 3px 5px rgba(0,0,0,.7);

height:100%;

display:flex;
align-items:center;
justify-content:center;

word-wrap:break-word;
overflow-wrap:break-word;
}


/* ================= BRAND SWITCHER ================= */

.brand-switcher{
display:flex;
gap:12px;
margin-bottom:20px;
}

.brand-btn{
flex:1;
height:70px;
padding:8px;
margin:0;
border-radius:12px;
cursor:pointer;

transition:all .35s ease;

opacity:.55;
filter:brightness(.8) saturate(.8);

transform:scale(.97);
}

/* TVTOTO NON AKTIF */

#btnTVTOTO{
background:linear-gradient(135deg,#4a0000,#7a0000);
border:2px solid #b8860b;
}

/* FATCAI99 NON AKTIF */

#btnFATCAI{
background:linear-gradient(135deg,#0f4d2f,#1f7a4d);
border:2px solid #d4af37;
}

/* PESONA805 NON AKTIF */

#btnPESONA{
background:linear-gradient(135deg,#5a0078,#a100ff);
border:2px solid #ff6bda;
}

/* TOMBOL AKTIF */

.brand-btn.active{
opacity:1;
filter:brightness(1.15) saturate(1.2);

transform:scale(1);

z-index:2;
}

.brand-btn img{
width:100%;
height:100%;
object-fit:contain;
}

.brand-btn.active{
border:2px solid #ffd86b;
box-shadow:0 0 15px rgba(255,216,107,.5);
background:#7a0000;
}

/* ACTIVE TVTOTO */

#btnTVTOTO.active{
background:linear-gradient(135deg,#7a0000,#b30000);
border:2px solid #ffd86b;
box-shadow:0 0 18px rgba(255,216,107,.6);
}

/* ACTIVE FATCAI99 */

#btnFATCAI.active{
background:linear-gradient(135deg,#0d4f2f,#138a52);
border:2px solid #ffd86b;
box-shadow:
0 0 12px rgba(255,216,107,.7),
0 0 25px rgba(19,138,82,.7);
}

/* ACTIVE PESONA805 */

#btnPESONA.active{
background:linear-gradient(135deg,#7a00cc,#ff3ec9);

border:2px solid #ff9df0;

box-shadow:
0 0 15px rgba(255,62,201,.7),
0 0 30px rgba(122,0,204,.8);
}


/* ================= BRAND LOGO PREVIEW ================= */

.brand-logo-preview{
position:absolute;
top:25px;
left:50%;
transform:translateX(-50%);
width:420px;
height:120px;
display:flex;
align-items:center;
justify-content:center;
z-index:30;
}

.brand-logo-preview img{
max-width:100%;
max-height:100%;
object-fit:contain;
filter:drop-shadow(0 4px 8px rgba(0,0,0,.6));
}


/* ================= PANEL ================= */

.panel{
width:400px;
min-width:400px;

position:sticky;
top:20px;

background:#460000;

border:3px solid #ffb300;
border-radius:20px;

padding:25px;

box-shadow:0 0 25px rgba(255,179,0,.25);
}

.panel h2{
text-align:center;

font-family:'Cinzel',serif;
font-size:36px;

margin-bottom:20px;

color:#ffd86b;
}

.input-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;

font-weight:700;
color:#ffd86b;
}

select{
width:100%;

padding:16px;

border:none;
border-radius:12px;

background:#720000;
color:white;

font-size:16px;
outline:none;
}

button{
width:100%;

padding:16px;

border:none;
border-radius:12px;

margin-top:12px;

cursor:pointer;

font-size:16px;
font-weight:700;

transition:.3s;

background:linear-gradient(to bottom,#ffd86b,#ff9800);

color:#550000;
}

button:hover{
transform:scale(1.02);
}

/* ================= MOBILE ================= */

@media(max-width:1300px){

.preview{
transform:scale(.75);
transform-origin:top center;
margin-bottom:-280px;
}

}

@media(max-width:1000px){

.preview{
transform:scale(.55);
margin-bottom:-500px;
}

}

@media(max-width:700px){

.preview{
transform:scale(.42);
margin-bottom:-700px;
}

}

@media(max-width:1400px){

.container{
flex-direction:column-reverse;
align-items:center;
}

.panel{
width:100%;
max-width:1254px;
min-width:auto;

position:relative;
top:auto;
}

.shio-circle{
border-radius:50%;
overflow:hidden;
border:8px solid #d4af37;

}

}

</style>
</head>

<script>


/* ================= BRAND ================= */

const brandData={

tvtoto:{
title:"GENERATOR SYAIR TVTOTO",
template:"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/tvtotolayout.png",
logo:"https://raw.githubusercontent.com/wfrans990/syair-tvtoto/main/logo%20tvtoto.png"
},

fatcai99:{
title:"GENERATOR SYAIR FATCAI99",
template:"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/fatnew.png",
logo:"https://raw.githubusercontent.com/wfrans990/syair-tvtoto/main/logo-fatcai99-1.png"
},

pesona805:{
title:"GENERATOR SYAIR PESONA805",
template:"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/pesonalayout.png",
logo:"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/new-logo-pesona805.png"
}

};

const fatcaiShioImages = {
"SHIO BABI":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/shiobabi.png",
"SHIO AYAM":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/shioayam.png",
"SHIO NAGA":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/shionaga.png",
"SHIO KELINCI":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/shiokelinci.png",
"SHIO ULAR":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/shioular.png",
"SHIO KERBAU":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/shiokerbau.png",
"SHIO HARIMAU":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/shioharimau.png",
"SHIO MONYET":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/shiomonyet.png",
"SHIO KAMBING":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/shiokambing.png",
"SHIO KUDA":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/shiokuda.png",
"SHIO TIKUS":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/shiotikus.png",
"SHIO ANJING":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/shioanjing.png"
};

const pesonaShioImages = {
"SHIO BABI":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/babipesona.png",
"SHIO AYAM":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/ayampesona.png",
"SHIO NAGA":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/nagapesona.png",
"SHIO KELINCI":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/kelincipesona.png",
"SHIO ULAR":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/ularpesona.png",
"SHIO KERBAU":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/kerbaupesona.png",
"SHIO HARIMAU":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/harimaupesona.png",
"SHIO MONYET":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/monyetpesona.png",
"SHIO KAMBING":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/kambingpesona.png",
"SHIO KUDA":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/kudapesona.png",
"SHIO TIKUS":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/tikuspesona.png",
"SHIO ANJING":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/anjingpesona.png"
};

function switchBrand(brand){

document.getElementById("btnTVTOTO").classList.remove("active");
document.getElementById("btnFATCAI").classList.remove("active");
document.getElementById("btnPESONA").classList.remove("active");

if(brand==="tvtoto"){

document.getElementById("btnTVTOTO").classList.add("active");

}else if(brand==="fatcai99"){

document.getElementById("btnFATCAI").classList.add("active");

}else{

document.getElementById("btnPESONA").classList.add("active");

}

/* GANTI GAMBAR SHIO SESUAI BRAND */

Object.keys(shioData).forEach(shio => {

    if(brand === "fatcai99"){

        if(fatcaiShioImages[shio]){
            shioData[shio].img = fatcaiShioImages[shio];
        }

}else if(brand === "pesona805"){

    if(pesonaShioImages[shio]){
        shioData[shio].img = pesonaShioImages[shio];
    }


    }else{

        const defaultImages = {
            "SHIO ULAR":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto/main/shio%20ular.png",
            "SHIO ANJING":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto/main/shio%20anjing.png",
            "SHIO HARIMAU":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto/main/shio%20harimau.png",
            "SHIO AYAM":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto/main/shio%20ayam.png",
            "SHIO TIKUS":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto/main/shio%20tikus.png",
            "SHIO MONYET":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto/main/shio%20monyet.png",
            "SHIO KELINCI":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto/main/shio%20kelinci.png",
            "SHIO KAMBING":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto/main/shio%20kambing.png",
            "SHIO BABI":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto/main/shio%20babi.png",
            "SHIO KERBAU":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto/main/shio%20kerbau.png",
            "SHIO KUDA":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto/main/shio%20kuda.png",
            "SHIO NAGA":"https://raw.githubusercontent.com/wfrans990/syair-tvtoto/main/shio%20nagaa.png"
        };

        shioData[shio].img = defaultImages[shio];
    }
});

/* REFRESH GAMBAR SHIO YANG SEDANG TAMPIL */

const currentShio = document.getElementById("shioSelect").value;

if(currentShio){
    document.getElementById("shioImage").src =
    shioData[currentShio].img;
}

window.currentBrand = brand;

document.querySelector(".panel h2").innerText=brandData[brand].title;

document.querySelector(".preview").style.backgroundImage=
`url('${brandData[brand].template}')`;

document.getElementById("brandLogoPreview").src =
brandData[brand].logo;

if(brand==="fatcai99"){

document.body.style.backgroundImage=
"url('https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/background-web-fatcai99.jpg')";

document.body.style.backgroundSize="cover";
document.body.style.backgroundPosition="center";
document.body.style.backgroundAttachment="fixed";
document.body.style.backgroundRepeat="no-repeat";

/* PANEL FATCAI */

document.querySelector(".panel").style.background =
"linear-gradient(180deg,#123a25,#0c2b1a)";

document.querySelector(".panel").style.border =
"3px solid #d4af37";

document.querySelector(".panel").style.boxShadow =
"0 0 30px rgba(212,175,55,.35)";

document.querySelector(".panel h2").style.color =
"#ffd86b";

document.querySelectorAll("label").forEach(el=>{
el.style.color="#ffd86b";
});

document.querySelectorAll("select").forEach(el=>{
el.style.background="#1b5e3b";
el.style.color="#fff";
});

document.querySelectorAll(".panel button:not(.brand-btn)").forEach(btn=>{
btn.style.background =
"linear-gradient(to bottom,#ffd86b,#d4af37)";
btn.style.color="#13472d";
});	

}else if(brand==="pesona805"){

document.body.style.backgroundImage=
"url('https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/background-web-pesona805-1.jpg')";

document.querySelector(".panel").style.background=
"linear-gradient(180deg,#3d005c,#190028)";

document.querySelector(".panel").style.border=
"3px solid #ff69d9";

document.querySelector(".panel").style.boxShadow=
"0 0 30px rgba(255,105,217,.45)";

document.querySelectorAll("label").forEach(el=>{
el.style.color="#ff9df0";
});

document.querySelectorAll("select").forEach(el=>{
el.style.background="#5d007f";
el.style.color="#fff";
});

document.querySelectorAll(".panel button:not(.brand-btn)").forEach(btn=>{
btn.style.background=
"linear-gradient(to bottom,#ff6bda,#c026ff)";
btn.style.color="#fff";
});

}else{

document.body.style.backgroundImage=
"url('https://raw.githubusercontent.com/wfrans990/syair-tvtoto-fatcai/main/tvtoto_backgroundweb.png')";
document.querySelector(".panel h2").style.color =
"#ffd86b";

document.querySelectorAll("label").forEach(el=>{
    el.style.color="#ffd86b";
});

document.body.style.backgroundSize="cover";
document.body.style.backgroundPosition="center";
document.body.style.backgroundAttachment="fixed";
document.body.style.backgroundRepeat="no-repeat";



document.querySelector(".shio-circle").style.border="none";
document.querySelector(".shio-circle").style.boxShadow="none";

document.getElementById("marketLogo").style.filter="drop-shadow(0 4px 5px rgba(0,0,0,.6))";

document.querySelector(".panel").style.background =
"#460000";

/* ================= DATE ================= */

function updateDate(){

const now=new Date();

const bulan=[
"JANUARI","FEBRUARI","MARET","APRIL","MEI","JUNI",
"JULI","AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"
];

const tanggal=
now.getDate()+" "+
bulan[now.getMonth()]+" "+
now.getFullYear();

document.getElementById("todayDate").innerText=tanggal;

}

/* ================= RANDOM ================= */

function resetCopyButton(){

const btn=document.getElementById("copyBtn");

btn.innerHTML="📋 COPY IMAGE";
btn.disabled=false;

}

function randomNumber(length){

let result='';

for(let i=0;i<length;i++){

result += Math.floor(Math.random()*10);

}

return result;

}

function randomColok(){

let arr=[];

while(arr.length<4){

let n=Math.floor(Math.random()*10);

if(!arr.includes(n)){

arr.push(n);

}

}

return arr;

}

/* ================= DOWNLOAD ================= */

async function downloadImage(){

const preview=document.getElementById("capture");

const oldTransform=preview.style.transform;
const oldMargin=preview.style.marginBottom;

preview.style.transform="scale(1)";
preview.style.marginBottom="0px";

await new Promise(resolve=>setTimeout(resolve,300));

try{

const canvas=await html2canvas(preview,{

useCORS:true,
allowTaint:false,
backgroundColor:null,
logging:false,

scale:1,

width:1254,
height:1254

});

preview.style.transform=oldTransform;
preview.style.marginBottom=oldMargin;

const shioName=
document.getElementById("shioName")
.innerText
.replace("SHIO ","Shio ");

const now=new Date();

const bulan=[
"Januari",
"Februari",
"Maret",
"April",
"Mei",
"Juni",
"Juli",
"Agustus",
"September",
"Oktober",
"November",
"Desember"
];

const tanggal=
now.getDate()+" "+
bulan[now.getMonth()];

const fileName=
`${shioName} ${tanggal}.png`;

const link=document.createElement("a");

link.download=fileName;

link.href=canvas.toDataURL("image/png");

link.click();

}catch(err){

alert("Gagal download gambar");

console.log(err);

}

}

/* ================= COPY IMAGE ================= */

async function copyImage(){

const btn=document.getElementById("copyBtn");

if(btn.disabled) return;

const preview=document.getElementById("capture");

const oldTransform=preview.style.transform;
const oldMargin=preview.style.marginBottom;

preview.style.transform="scale(1)";
preview.style.marginBottom="0px";

await new Promise(resolve=>setTimeout(resolve,300));

try{

const canvas=await html2canvas(preview,{

useCORS:true,
allowTaint:false,
backgroundColor:null,
logging:false,

scale:1,

width:1254,
height:1254

});

preview.style.transform=oldTransform;
preview.style.marginBottom=oldMargin;

canvas.toBlob(async(blob)=>{

window.allowImageCopy=true;

await navigator.clipboard.write([
new ClipboardItem({
'image/png': blob
})
]);

window.allowImageCopy=false;

/* UBAH TOMBOL */

btn.innerHTML="✅ BERHASIL COPY";
btn.disabled=true;

});

}catch(err){

console.log(err);

}

}
